[project]
name = "data-service"
version = "0.1.0"
description = "个股盘面分析行情数据侧车（FastAPI）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
]

[tool.uvicorn]
host = "127.0.0.1"
port = 8000
reload = true
app_dir = "data-service"
